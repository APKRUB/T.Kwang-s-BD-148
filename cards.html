<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การ์ดอวยพร</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase & Interact.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body class="board-body">
    <audio id="bg-music" src="BD2.mp3" autoplay loop></audio>

    <div class="board" id="card-board">
        <h2 class="board-title">ลากซองจดหมายเล่นได้ หรือกดเพื่อเปิดดูคำอวยพร 💌</h2>
        <div id="envelopes-container"></div>
    </div>

    <!-- กล่อง Pop-up -->
    <div id="card-popup" class="modal-overlay">
        <div class="modal-card">
            <span class="close-modal" onclick="closeCardPopup()">&times;</span>
            <h3 id="popup-sender" style="color: #ff7675;"></h3>
            <p id="popup-message" style="font-size: 18px; margin-top: 15px;"></p>
            <div id="popup-image-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.onload = loadGreetings;
    </script>
</body>
</html>
