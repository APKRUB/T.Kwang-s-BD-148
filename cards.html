<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การ์ดอวยพร</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase & Interact.js -->
    <script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js](https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js)"></script>
</head>
<body class="board-body">
    <!-- ⚠️ อย่าลืมแก้ตรง src เป็นลิงก์เพลงวันเกิดไทยของคุณ -->
    <audio id="bg-music" src="BD2.mp3" autoplay loop></audio>

    <div class="board" id="card-board">
        <h2 class="board-title">ลากเพื่อจัดเรียง เปิดซองเพื่ออ่านคำอวยพร 💌</h2>
        <div id="envelopes-container">
            <!-- ซองจดหมายจะถูกสร้างผ่าน JavaScript ที่นี่ -->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // เรียกใช้ฟังก์ชันดึงข้อมูลเมื่อโหลดหน้าเสร็จ
        window.onload = loadGreetings;
    </script>
</body>
</html>
